[package]
name = "lumora-boot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lumora-boot"
path = "src/main.rs"
test = false
bench = false

[features]
exception-test = ["lumora-kernel/exception-test"]

[dependencies]
lumora-kernel = { path = "../kernel" }
uefi = { version = "0.34", features = ["alloc", "global_allocator"] }
